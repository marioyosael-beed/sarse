<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Feliz 30 de septiembre</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: radial-gradient(ellipse at 50% 40%, #0a1a3f, #040b1f);
            display: flex;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui
        }

        svg {
            height: 100%;
            max-width: 100%
        }

        .t {
            font-size: 34px;
            fill: #2fb8f0;
            text-anchor: middle;
            font-family: "Comic Sans MS", sans-serif
        }

        .f {
            font-size: 30px;
            font-weight: 800;
            fill: #ffd23f;
            text-anchor: middle;
            opacity: 0;
            transition: opacity 1s
        }

        .f.on {
            opacity: 1
        }

        .sw {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: sw 3.6s ease-in-out infinite alternate
        }

        @keyframes sw {
            from {
                transform: rotate(-3deg)
            }

            to {
                transform: rotate(3deg)
            }
        }

        .st {
            animation: tw 2.4s ease-in-out infinite
        }

        @keyframes tw {
            50% {
                opacity: .15
            }
        }

        #lid {
            transform-box: fill-box;
            transform-origin: 0 100%;
            transition: transform .7s
        }

        #g.open #lid {
            transform: rotate(-55deg)
        }
    </style>
</head>

<body>
    <svg id="s" viewBox="0 0 360 640">
        <defs>
            <clipPath id="c">
                <rect x="-25" y="-31" width="50" height="62" rx="4" />
            </clipPath>
        </defs>
        <g id="stars"></g>
        <text class="t" x="180" y="58">Feliz 30 de</text>
        <text class="t" x="180" y="100">septiembre mi bro</text>
        <text class="f" id="f" x="180" y="148">¡Felis 30 chico! 🎉
            <g id="stems" stroke="#2e9c3a" stroke-width="3"></g>
            <path d="M180 552 L78 360 Q70 335 92 345 L190 470Z" fill="#7aa9dd" />
            <path d="M180 552 L282 360 Q290 335 268 345 L170 470Z" fill="#8fb8e6" />
            <path d="M180 552 L120 400 L240 400Z" fill="#5f93d3" />
            <g id="cards"></g>
            <path d="M180 538 l-22 -12 v24z M180 538 l22 -12 v24z" fill="#3b82d6" />
            <circle cx="180" cy="538" r="6" fill="#9cc8ff" />
            <g id="r"></g>
            <g id="g" transform="translate(150 566)" style="cursor:pointer">
                <rect y="16" width="60" height="42" rx="4" fill="#2f6fd0" />
                <rect x="26" y="16" width="8" height="42" fill="#ffd23f" />
                <g id="lid">
                    <rect x="-4" y="4" width="68" height="14" rx="3" fill="#3b82d6" />
                    <rect x="26" y="4" width="8" height="14" fill="#ffd23f" />
                </g>
                <text x="30" y="80" text-anchor="middle" font-size="11" fill="#9cc8ff">Ábrelo 🎁</text>
            </g>
    </svg>
